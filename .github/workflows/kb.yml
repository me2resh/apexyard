name: Knowledge base

on:
  push:
    branches: [dev, main]
    paths:
      - 'handbooks/**'
      - '.claude/rules/**'
      - 'docs/agdr/**'
      - 'docs/orbit/**'
      - 'bin/kb-*'
      - 'bin/_lib-kb.sh'
      - '.github/workflows/kb.yml'
  pull_request:
    paths:
      - 'handbooks/**'
      - '.claude/rules/**'
      - 'docs/agdr/**'
      - 'docs/orbit/**'
      - 'bin/kb-*'
      - 'bin/_lib-kb.sh'
      - '.github/workflows/kb.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# One group per event family so a push does not cancel the nightly run.
concurrency:
  group: kb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile knowledge base
        run: bin/kb-compile

      - name: Check handbook indexes
        run: bin/kb-index --check

      - name: Upload kb artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kb-compile
          path: kb/
          if-no-files-found: warn

  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run freshness check
        run: bin/kb-freshness --out "$RUNNER_TEMP/kb-stale-report.md"

      - name: Open or update stale report PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: kb/stale-entries
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          report="$RUNNER_TEMP/kb-stale-report.md"
          if [ ! -f "$report" ]; then
            echo "No stale entries. Nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          existing_pr=$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')

          git fetch origin "$DEFAULT_BRANCH" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH_NAME"; then
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME"
          else
            git checkout -B "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"
          fi

          cp "$report" ./kb-stale-report.md
          git add kb-stale-report.md
          if git diff --cached --quiet; then
            echo "Report file unchanged on branch."
          else
            git commit -m "$(cat <<'EOF'
docs: refresh knowledge-base stale report

EOF
)"
            git push -u origin "$BRANCH_NAME"
          fi

          body=$(cat <<EOF
## Summary

- Automated freshness check found stale knowledge-base entries.
- Report file: \`kb-stale-report.md\`.

## Glossary

- **stale_after** — Date after which a handbook or rule needs a fresh review.
- **kb-freshness** — Script that lists entries past \`stale_after\`.

EOF
)

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$BRANCH_NAME" \
              --title "docs: knowledge-base stale entries" \
              --body "$body"
          fi
