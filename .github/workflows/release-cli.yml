name: Release CLI
# The CLI carries the framework version. Reusable; called from
# auto-tag-on-release-pr-merge.yml after the tag and GitHub Release exist
# (AgDR-0276, AgDR-0076). A tag push made with
# GITHUB_TOKEN starts no workflow, so this workflow has no tag trigger.
# The npm-publish job publishes create-apexyard when the NPM_TOKEN secret
# exists. It skips with a notice when the secret is absent (AgDR-0300).
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example v5.11.0"
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        description: "npm automation token for create-apexyard. Optional."
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v5.11.0"
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build release assets
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          bash bin/build-release-assets.sh "$VERSION" dist
          bash bin/stamp-packaging.sh "$VERSION" dist
          (cd dist/create-apexyard && npm pack --ignore-scripts --pack-destination ..)
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.sha256 dist/install.sh dist/apexyard.rb dist/*.tgz --clobber

  npm-publish:
    # Publish the same create-apexyard tarball that the release job attached.
    # The token stays in the environment. npm reads it through .npmrc.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Publish create-apexyard to npm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN is not set. The npm publish was skipped."
            exit 0
          fi
          version=${VERSION#v}
          if npm view "create-apexyard@$version" version > /dev/null 2>&1; then
            echo "::notice::create-apexyard@$version is already on npm."
            exit 0
          fi
          work=$(mktemp -d)
          gh release download "$VERSION" --pattern "create-apexyard-$version.tgz" --dir "$work"
          # shellcheck disable=SC2016 # npm expands the variable, not the shell.
          printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$work/.npmrc"
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          NPM_CONFIG_USERCONFIG="$work/.npmrc" npm publish "$work/create-apexyard-$version.tgz" \
            --provenance --access public --ignore-scripts --tag "$dist_tag"
