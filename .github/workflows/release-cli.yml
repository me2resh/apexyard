name: Release CLI
# The CLI carries the framework version. Reusable; called from
# auto-tag-on-release-pr-merge.yml after the tag and GitHub Release exist
# (AgDR-0276, AgDR-0076). A tag push made with
# GITHUB_TOKEN starts no workflow, so this workflow has no tag trigger.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, for example v5.11.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v5.11.0"
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build release assets
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          bash bin/build-release-assets.sh "$VERSION" dist
          bash bin/stamp-packaging.sh "$VERSION" dist
          (cd dist/create-apexyard && npm pack --ignore-scripts --pack-destination ..)
      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes
          fi
          gh release upload "$VERSION" dist/*.tar.gz dist/*.sha256 dist/install.sh dist/apexyard.rb dist/*.tgz --clobber
