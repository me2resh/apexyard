name: docs lint

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'handbooks/**'
      - 'roles/**'
      - '.claude/skills/**'
      - 'bin/docs-lint.mjs'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v5.0.0
        with:
          node-version: '22'
      - name: Report all findings
        run: node bin/docs-lint.mjs --summary
      # Step 2 will remove continue-on-error and add --strict.
      - name: Report findings on changed lines
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node bin/docs-lint.mjs --base "origin/$BASE_REF"
