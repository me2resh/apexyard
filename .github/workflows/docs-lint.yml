name: docs lint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Report all findings
        run: node bin/docs-lint.mjs --summary
      # Strict mode fails the job when a finding touches an added line in a file in scope.
      # Unchanged files stay report only. No changed file in scope means exit 0 at once.
      # The check can become a required check without staying pending.
      - name: Check added lines (strict)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node bin/docs-lint.mjs --base "origin/$BASE_REF" --strict
