# ShellCheck — dogfood apexyard itself
#
# Runs shellcheck against the hook scripts under .claude/hooks/ to catch
# portability bugs, quoting mistakes, and common shell pitfalls. The hook
# scripts are the mechanical enforcement layer for the apexyard workflow,
# so any bug there weakens the whole stack.

name: ShellCheck

on:
  pull_request:
    paths:
      - ".claude/hooks/**"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - ".claude/hooks/**"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck .claude/hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./.claude/hooks"
          severity: warning
          ignore_paths: >-
            .claude/hooks/README.md
