# Dependency audit for dev changes and release scans.
# Keep the audit steps here so all callers enforce the same policy.
name: Dependency Audit

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dep-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install trusted audit tools (isolated)
        run: |
          python3 -m venv "$RUNNER_TEMP/dep-audit-tools"
          "$RUNNER_TEMP/dep-audit-tools/bin/python" -m pip install --require-hashes \
            -r golden-paths/pipelines/scripts/dependency-audit-tools.requirements.txt

      - name: Stage selected dependency sets
        run: |
          # Keep fixtures outside the audit root. Preserve the source paths.
          audit_root="$RUNNER_TEMP/dep-audit-input"
          for directory in harness-adapters/pi harness-adapters/opencode topologies/typescript-nextjs/starter; do
            mkdir -p "$audit_root/$directory"
            cp "$directory/package.json" "$directory/package-lock.json" "$audit_root/$directory/"
          done
          directory="golden-paths/pipelines/scripts"
          mkdir -p "$audit_root/$directory"
          cp "$directory/dependency-audit-tools.requirements.txt" "$audit_root/$directory/"
          # The helper discovers requirements*.txt and follows requirement includes.
          echo '-r dependency-audit-tools.requirements.txt' > "$audit_root/$directory/requirements.txt"

      - name: Run shared dependency audit helper
        run: |
          trusted_python="$RUNNER_TEMP/dep-audit-tools/bin/python"
          set +e
          "$trusted_python" -I golden-paths/pipelines/scripts/dependency-audit.py \
            "$RUNNER_TEMP/dep-audit-input" \
            --trusted-python "$trusted_python" \
            --json-out "$RUNNER_TEMP/dep-audit-report.json" \
            --md-out "$RUNNER_TEMP/dep-audit-report.md"
          code=$?
          set -e
          # The helper fails on Critical. Enforce High through its JSON report.
          python3 - "$RUNNER_TEMP/dep-audit-report.json" "$code" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          totals = report['severity_totals']
          blocking = totals.get('High', 0) + totals.get('Critical', 0)
          if blocking:
              print('::error::Dependency audit found HIGH or CRITICAL vulnerabilities.')
          sys.exit(1 if blocking else int(sys.argv[2]))
          PYTHON

      - name: Report dependency audit to step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/dep-audit-report.md" ]; then
            {
              cat "$RUNNER_TEMP/dep-audit-report.md"
              echo 'Policy: The job fails on HIGH or CRITICAL findings. It also fails when the audit cannot complete (helper exit 3, incomplete coverage, such as a registry outage) or a severity is Unknown (exit 4). MODERATE (Medium) and LOW are reported only.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Dependency audit: FAILED - no report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

