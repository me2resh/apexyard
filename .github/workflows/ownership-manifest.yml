name: ownership manifest

# Fail when a shipped path has no owner in .claude/ownership-manifest.yaml
# (me2resh/apexyard#1887, AgDR-0274). Runs on docs-only PRs too.
on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ownership-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that each path has an owner
        run: bash bin/check-ownership-manifest.sh
