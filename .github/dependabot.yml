version: 2
updates:
  # Dependency surfaces: GitHub Actions in .github/workflows/** and npm manifests
  # in harness-adapters/pi and harness-adapters/opencode. #518.
  # (site/ moved to me2resh/apexyard-site, #663)
  - package-ecosystem: "github-actions"
    directory: "/"
    # Follow the release-cut model — open bump PRs against dev, not the default
    # main branch (main only receives release PRs, AgDR-0007). #588.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group the codeql-action family so init/analyze/upload-sarif version
    # bumps land as ONE PR instead of splitting. codeql.yml pins init and
    # analyze to the same version — CodeQL fails CI if they mismatch, which
    # is exactly what split PRs (#800 init, #801 analyze) produced. #807.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
  # Track both harness adapter npm manifests. #1540.
  - package-ecosystem: "npm"
    directory: "/harness-adapters/pi"
    # Target dev for release cuts (AgDR-0007 / #588).
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor and patch updates per adapter, leaving major updates separate. #1601.
    groups:
      pi-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/harness-adapters/opencode"
    # Target dev for release cuts (AgDR-0007 / #588).
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor and patch updates per adapter, leaving major updates separate. #1601.
    groups:
      opencode-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
